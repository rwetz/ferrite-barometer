[package]
name = "ferrite-barometer"
version = "0.2.0"
description = "A Ferrite weather station: ASCII gauges, a 24-hour forecast chart, rain in dither and a heatmap of the week."
authors = ["Ryan Wetzstein"]
license = "Apache-2.0"
repository = "https://github.com/rwetz/ferrite-barometer"
readme = "README.md"
keywords = ["gpui", "ferrite", "weather", "forecast", "desktop"]
categories = ["gui", "visualization"]
edition = "2024"
rust-version = "1.88"

[dependencies]
ferrite-design = { git = "https://github.com/rwetz/ferrite-design", rev = "0b13d8087942fd4dc65c2a62ef19bdf60f7547e7" }
# Must match ferrite-design exactly (PITFALLS §1).
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde_json = "1.0.151"
ureq = "3.4.2"

# gpui is sluggish unoptimised; optimise dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"
